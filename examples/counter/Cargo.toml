[package]
name = "bombay-example-counter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "bombay-example-counter"

[lints]
workspace = true

[dependencies]
bombay-rs = { path = "../../crates/bombay" }
tokio.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
json-event-parser = { version = "=0.2.3", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }

[dev-dependencies]
dhat = "0.3.3"

[features]
protected-transport = ["dep:zenoh"]

[dependencies.zenoh]
package = "bombay-zenoh"
version = "=1.10.8"
optional = true
default-features = false
features = ["transport_tls"]
