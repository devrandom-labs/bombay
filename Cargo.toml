# Bombay runtime layers over the universal direct-Behavior Driver.
[workspace]
resolver = "3"
members = [
    "examples/actor-templates",
    "examples/application-topology",
    "examples/axum",
    "examples/counter",
    "examples/entity",
    "examples/supervision",
    "examples/worker-pool",
    "crates/bombay",
    "crates/bombay-macros",
    "crates/bombay-machine",
    "crates/bombay-engine",
    "crates/observe-tests",
    "crates/observe-perf",
    "crates/mutants-gate",
]
exclude = [
    "crates/bombay/fuzz",
    "crates/bombay-engine/fuzz",
    "crates/observe-fuzz",
]
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/bombay"

[workspace.dependencies]
tokio = { version = "1.47", default-features = false }
# The pure Behavior algebra (Actions/Envelope/Create/the capability stack) —
# depended on, never copied.
behavior = { package = "bombay-behavior-actors", version = "0.14.0" }
bombay-engine = { version = "0.1.0", path = "crates/bombay-engine" }
bombay-address = "0.2.0"
bombay-machine = { path = "crates/bombay-machine" }
communication = { package = "bombay-communication", version = "0.1.2" }
timers = { package = "bombay-timers", version = "0.1.0" }
parking_lot = "0.12"
triomphe = { version = "0.1", default-features = false, features = ["std"] }
proptest = "1.11"
criterion = { version = "0.7", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro-crate = "3"
axum = "0.8.9"

[patch.crates-io]
bombay-behavior = { git = "https://github.com/devrandom-labs/bombay-behavior.git", rev = "a272adf8d2cbb6a2784d565f47c74adff3e7d01b" }
bombay-behavior-actors = { git = "https://github.com/devrandom-labs/bombay-behavior.git", rev = "a272adf8d2cbb6a2784d565f47c74adff3e7d01b" }
bombay-behavior-macros = { git = "https://github.com/devrandom-labs/bombay-behavior.git", rev = "a272adf8d2cbb6a2784d565f47c74adff3e7d01b" }
bombay-timers = { git = "https://github.com/devrandom-labs/bombay-timers.git", rev = "13e884da7ab41781f52337b0038060e375b00ee0" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(bombay_entity_loom)'] }
