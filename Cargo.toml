# bombay — process, handle, and the driver
# that interprets a behavior's Actions.
#
# Layering: behavior owns the pure Behavior algebra; bombay owns the
# pluggable process boundary and runtime interpretation. Concrete event sources
# and transports remain replaceable modules.
[workspace]
resolver = "3"
members = [
    "crates/bombay",
    "crates/bombay-framework",
    "crates/bombay-engine",
    "crates/mutants-gate",
]
exclude = ["crates/bombay/fuzz"]
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/bombay"

[workspace.dependencies]
tokio = { version = "1.47", default-features = false }
# The pure Behavior algebra (Actions/Envelope/Create/the capability stack) —
# depended on, never copied.
behavior = { package = "bombay-behavior", version = "0.10.0" }
bombay-transition = "0.1.0"
bombay-machine-executor = "0.1.0"
communication = { package = "bombay-communication", version = "0.1.1" }
bombay-address = "0.1.1"
observe = { package = "bombay-observe", version = "0.1.0" }
bombay-timers = "0.1.0"
bombay = { package = "bombay-rs", version = "0.1.0", path = "crates/bombay" }
bombay-engine = { version = "0.1.0", path = "crates/bombay-engine" }
proptest = "1.11"
criterion = { version = "0.7", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
