[workspace]
resolver = "3"
# Siblings (cesr/nexus) enumerate members explicitly — no `crates/*` glob
# (also keeps the isolated `fuzz/` sub-workspace out of any glob's reach).
members = ["crates/core", "crates/macros", "mutants-gate"]
# `apps/purr` is the vendored TUI, awaiting re-point onto the rebuilt core by
# the console card. Excluded so the workspace builds without the deleted
# vendored crate it still depends on.
exclude = ["apps/purr"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/bombay"

[workspace.dependencies]
futures = "0.3"
tokio = "1.47"
# Mailbox channel primitive — chosen on measured evidence (ADR-0001, card #133):
# fastest async candidate, executor-agnostic, move-based, has weak senders.
flume = "0.12"
# Inline-small watcher lists (card #195): a watched actor's watcher list is 0-or-1
# in the common case; `[_; 1]` inline keeps that heap-free while spilling for
# popular actors. Uncapped by design (OTP has no monitor limit) — never ArrayVec.
smallvec = "1"
# Cooperative cancellation for the actor run-loop (card #116, absorbs #55).
# CancellationToken::run_until_cancelled drives graceful stop without a select!.
# `time` (card #196): DelayQueue serves the supervisor's per-child restart
# deadlines — N items, each with a deadline, yield the next expired — replacing
# a hand-rolled min-scan we would otherwise have to mutation-test ourselves.
tokio-util = { version = "0.7", features = ["time"] }
# Restart-backoff jitter (card #196): zero-dep and SEEDABLE — DST tests seed the
# generator and assert exact jittered delays instead of disabling jitter and
# leaving the jitter path untested.
fastrand = "2"
# Structural pinning for the hand-named request futures (card #118, ADR-0007):
# lets a !Unpin `Sleep` live inline (no per-request box on the timed paths).
# Declarative macro only — no proc-macro, no transitive deps.
pin-project-lite = "0.2"
proptest = "1.11"
# Typed error domains (card #113): thiserror for derived Display/Error (rule #3:
# no manual impls); downcast-rs to recover a concrete panic payload from the
# type-erased ReplyError trait object.
thiserror = "2.0"
downcast-rs = "2.0"
# Local name→actor registry map (card #119): lock-free reads, purpose-built for
# read-heavy lookup with concurrent register/unregister churn; `compute` gives
# an atomic per-key decision (register-once without check-then-act). Chosen over
# dashmap (sync shard lock held across .await = deadlock class) and scc — see
# the finalized research on card #119.
papaya = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Compile-time trait-impl assertions — card #206 pins `ActorId` non-serializable
# (`assert_not_impl_any!`), a dev-only build-time proof.
static_assertions = "1.1"

# ============================================================
# Bombay — god-level lint config (adopted from nexus — card #61).
#
# The bar is DENY workspace-wide; every crate opts in with `[lints]
# workspace = true`. The vendored-kameo quarantine headers left with the
# vendored tree (card #213) — all remaining code is held to the bar directly.
#
# DEVIATION from nexus-verbatim: `disallowed_types` (the std::sync::Mutex /
# RwLock ban) is NOT adopted — see clippy.toml for the rationale (the real
# rule is "no lock held across .await", a per-site call, not a type ban).
# ============================================================
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
# 1. THE FOUNDATION
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# 2. THE RUTHLESS RESTRICTIONS (disallowed_types omitted — see header)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"

# 3. MEMORY & PERFORMANCE STRICTNESS
clone_on_ref_ptr = "deny"
as_conversions = "deny"
str_to_string = "deny"
implicit_clone = "deny"

# 4. VARIABLE HYGIENE
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# 5. THE "NO CHEATING" RULE — every #[allow] must carry a reason.
allow_attributes_without_reason = "deny"

[workspace.metadata.crane]
name = "bombay"

[profile.release]
# NOT a size/perf knob — a correctness one (card #169). bombay-core's actor
# supervision is built on catch_unwind (actor::kind, actor::spawn); `abort`
# makes those boundaries catch nothing, turning an inspectable PanicError into a
# process kill. Cargo ignores `panic` for tests, so flipping this breaks nothing
# the suite can see. `unwind` is also cargo's default: this line exists to state
# the requirement, and bombay-core's cfg(panic = "abort") compile_error enforces
# it for any profile — including a downstream consumer's, which this cannot
# reach.
panic = "unwind"
lto = true
opt-level = 3
codegen-units = 1
