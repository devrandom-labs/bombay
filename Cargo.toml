# Bombay runtime layers over the universal direct-Behavior Driver.
[workspace]
resolver = "3"
members = [
    "crates/bombay",
    "crates/bombay-engine",
    "crates/bombay-macros",
    "crates/mutants-gate",
]
exclude = ["crates/bombay/fuzz", "crates/bombay-engine/fuzz"]
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/bombay"

[workspace.dependencies]
tokio = { version = "1.47", default-features = false }
# The pure Behavior algebra (Actions/Envelope/Create/the capability stack) —
# depended on, never copied.
behavior = { package = "bombay-behavior-actors", version = "0.12.0" }
bombay-engine = { version = "0.1.0", path = "crates/bombay-engine" }
bombay-macros = { version = "0.1.0", path = "crates/bombay-macros" }
bombay-address = "0.2.0"
observe = { package = "bombay-observe", version = "0.1.1" }
communication = { package = "bombay-communication", version = "0.1.2" }
timers = { package = "bombay-timers", version = "0.1.0" }
proptest = "1.11"
criterion = { version = "0.7", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[patch.crates-io]
bombay-behavior = { path = "../bombay-behavior/crates/behavior" }
bombay-behavior-macros = { path = "../bombay-behavior/crates/behavior-macros" }
bombay-behavior-actors = { path = "../bombay-behavior/crates/actors" }
bombay-address = { path = "../bombay-address/crates/address" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
