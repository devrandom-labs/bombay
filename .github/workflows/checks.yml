name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Flake Check
        run: nix flake check -L

      - name: Bounded Driver fuzz campaign
        id: driver_fuzz
        run: nix develop .#fuzz -c bash crates/bombay-engine/fuzz/verify-causal-turns.sh

      - name: Retain Driver fuzz corpus and crashes
        if: always() && (steps.driver_fuzz.outcome == 'success' || steps.driver_fuzz.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-fuzz-${{ github.run_id }}
          path: crates/bombay-engine/fuzz/artifacts/causal_turns/
          if-no-files-found: error
          retention-days: 14

      - name: Bounded Observe fuzz campaign
        id: observe_fuzz
        run: nix develop .#fuzz -c bash crates/observe-fuzz/verify-observation-operations.sh

      - name: Retain Observe fuzz corpus and crashes
        if: always() && (steps.observe_fuzz.outcome == 'success' || steps.observe_fuzz.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observe-fuzz-${{ github.run_id }}
          path: crates/observe-fuzz/artifacts/run.*/
          if-no-files-found: error
          retention-days: 14

      - name: Bounded Observe Miri campaign
        id: observe_miri
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix develop .#miri -c bash crates/observe-tests/verify-miri.sh

      - name: Retain Observe Miri result
        if: always() && (steps.observe_miri.outcome == 'success' || steps.observe_miri.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observe-miri-${{ github.run_id }}
          path: target/miri-evidence/
          if-no-files-found: error
          retention-days: 14

  native_tls_research:
    name: Native TLS research (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/static-remote-transport
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Format and lint native fixture
        run: |
          nix develop -c cargo fmt --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml --all -- --check
          nix develop -c cargo clippy --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml --locked --bin transport_custody -- -D warnings
      - name: Build native fixture
        shell: bash
        run: |
          profile_args=()
          if [[ '${{ matrix.profile }}' == 'release' ]]; then
            profile_args+=(--release)
          fi
          nix develop -c cargo build --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml --locked --bin transport_custody --jobs 2 "${profile_args[@]}"
      - name: Observe both TLS layouts
        run: |
          nix develop -c python3 docs/prds/static-remote-actors/transport-custody/verify_transport_custody.py \
            "$CARGO_TARGET_DIR/${{ matrix.profile }}/transport_custody" \
            docs/prds/static-remote-actors/transport-custody/certificates \
            "target/transport-evidence/${{ matrix.profile }}"
      - name: Build and verify protected Counter Applications
        shell: bash
        run: |
          nix develop -c bash -euo pipefail -c "$(cat <<'PROTECTED_COUNTER'
          profile_args=()
          if [[ '${{ matrix.profile }}' == 'release' ]]; then
            profile_args+=(--release)
          fi
          evidence="target/transport-evidence/${{ matrix.profile }}"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/protected-counter-revision.txt"
          printf '%s\n' '${{ matrix.profile }}' > "$evidence/protected-counter-profile.txt"
          sha256sum \
            Cargo.toml Cargo.lock flake.lock examples/counter/Cargo.toml \
            crates/bombay/Cargo.toml crates/bombay/src/remote/mod.rs \
            crates/bombay/src/remote/ingress.rs crates/bombay/src/remote/verification.rs \
            docs/prds/static-remote-actors/transport-custody/Cargo.toml \
            docs/prds/static-remote-actors/transport-custody/Cargo.lock \
            examples/counter/src/counter.rs crates/bombay/tests/protected_counter/mod.rs \
            crates/bombay/tests/protected_counter/transport.rs \
            crates/bombay/tests/protected_counter/retirement.rs \
            crates/bombay/tests/protected_counter/protected/mod.rs \
            crates/bombay/tests/protected_counter/protected/tests.rs \
            > "$evidence/protected-counter-sources.sha256"
          sha256sum docs/prds/static-remote-actors/transport-custody/certificates/*.pem \
            > "$evidence/protected-counter-certificates.sha256"
          cargo test --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml \
            --locked --jobs 2 --test protected_counter --features protected-transport --no-run --message-format=json \
            "${profile_args[@]}" > "$evidence/protected-counter-build.jsonl" \
            2> "$evidence/protected-counter-build.stderr"
          expected_optimization=0
          if [[ '${{ matrix.profile }}' == 'release' ]]; then
            expected_optimization=3
          fi
          artifact="$evidence/protected-counter-artifact.json"
          jq -ces \
            --arg optimization "$expected_optimization" '
              [.[] | select(.reason == "compiler-artifact"
                and .target.name == "protected_counter" and .target.kind == ["test"]
                and .profile.test == true
                and .profile.opt_level == $optimization
                and ((.features | index("protected-transport")) != null))
                | {source: .target.src_path, executable: .executable}]
              | if length == 1 then
                  .[0]
                  | if ((.source | type) == "string"
                      and (.executable | type) == "string"
                      and (.source | length) > 0
                      and (.executable | length) > 0) then .
                    else error("protected Counter artifact paths must be strings") end
                else error("exact protected Counter test executable was not built") end
            ' "$evidence/protected-counter-build.jsonl" > "$artifact"
          native_source=$(jq -er '.source' "$artifact")
          executable=$(jq -er '.executable' "$artifact")
          [[ "$native_source" -ef "$PWD/crates/bombay/tests/protected_counter/mod.rs" ]]
          sha256sum "$executable" > "$evidence/protected-counter-executable.sha256"
          controller=remote_counter::campaigns::all_release_and_evidence_cases_cross_actual_native_roles
          if cargo test --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml \
            --locked --jobs 2 --test protected_counter --features protected-transport \
            "${profile_args[@]}" "$controller" -- --exact --nocapture \
            > "$evidence/protected-counter-matrix.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          printf '%s\n' "$result" > "$evidence/protected-counter-matrix.exit"
          sha256sum "$evidence/protected-counter-matrix.log" "$evidence/protected-counter-matrix.exit" \
            > "$evidence/protected-counter-matrix.sha256"
          cat "$evidence/protected-counter-matrix.log"
          if [[ "$result" != 0 ]]; then
            exit "$result"
          fi
          test "$(grep -Fxc "test $controller ... ok" "$evidence/protected-counter-matrix.log")" -eq 1
          test "$(grep -c '^native configuration completed: ' "$evidence/protected-counter-matrix.log")" -eq 32
          "$executable" child_stop_keeps_original_target_and_sibling \
            --nocapture > "$evidence/protected-child-stop.log" 2>&1
          test "$(grep -Ec '^test [^[:space:]]+ \.\.\. ok$' "$evidence/protected-child-stop.log")" -eq 2
          test "$(grep -Fxc 'test remote_counter::child_stop_keeps_original_target_and_sibling_for_recorded_proof ... ok' "$evidence/protected-child-stop.log")" -eq 1
          test "$(grep -Fxc 'test remote_counter::child_stop_keeps_original_target_and_sibling_for_scheduled_proof ... ok' "$evidence/protected-child-stop.log")" -eq 1
          test "$(grep -c '^test result:' "$evidence/protected-child-stop.log")" -eq 1
          test "$(grep -Ec '^test result: ok\. 2 passed; 0 failed; 0 ignored;' "$evidence/protected-child-stop.log")" -eq 1
          "$executable" native_query_count_covers_provider_and_queue \
            --nocapture > "$evidence/protected-query-count.log" 2>&1
          test "$(grep -Ec '^test [^[:space:]]+ \.\.\. ok$' "$evidence/protected-query-count.log")" -eq 2
          test "$(grep -Fxc 'test remote_counter::native_query_count_covers_provider_and_queue_for_recorded_proof ... ok' "$evidence/protected-query-count.log")" -eq 1
          test "$(grep -Fxc 'test remote_counter::native_query_count_covers_provider_and_queue_for_scheduled_proof ... ok' "$evidence/protected-query-count.log")" -eq 1
          test "$(grep -c '^test result:' "$evidence/protected-query-count.log")" -eq 1
          test "$(grep -Ec '^test result: ok\. 2 passed; 0 failed; 0 ignored;' "$evidence/protected-query-count.log")" -eq 1
          "$executable" --exact remote_counter::native_reply_count_keeps_active_and_unread_originals \
            --nocapture > "$evidence/protected-reply-count.log" 2>&1
          test "$(grep -Ec '^test [^[:space:]]+ \.\.\. ok$' "$evidence/protected-reply-count.log")" -eq 1
          test "$(grep -Fxc 'test remote_counter::native_reply_count_keeps_active_and_unread_originals ... ok' "$evidence/protected-reply-count.log")" -eq 1
          test "$(grep -c '^test result:' "$evidence/protected-reply-count.log")" -eq 1
          test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$evidence/protected-reply-count.log")" -eq 1
          PROTECTED_COUNTER
          )"
      - name: Retain native transport observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-tls-${{ matrix.profile }}-${{ github.run_id }}
          path: target/transport-evidence/${{ matrix.profile }}/
          if-no-files-found: warn
          retention-days: 14
