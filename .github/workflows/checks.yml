name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', 'Cargo.lock', 'flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Flake Check
        run: nix flake check -L

      - name: Bounded Driver fuzz campaign
        id: driver_fuzz
        run: nix develop .#fuzz -c bash crates/bombay-engine/fuzz/verify-causal-turns.sh

      - name: Retain Driver fuzz corpus and crashes
        if: always() && (steps.driver_fuzz.outcome == 'success' || steps.driver_fuzz.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-fuzz-${{ github.run_id }}
          path: crates/bombay-engine/fuzz/artifacts/causal_turns/
          if-no-files-found: error
          retention-days: 14

      - name: Bounded Observe fuzz campaign
        id: observe_fuzz
        run: nix develop .#fuzz -c bash crates/observe-fuzz/verify-observation-operations.sh

      - name: Retain Observe fuzz corpus and crashes
        if: always() && (steps.observe_fuzz.outcome == 'success' || steps.observe_fuzz.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observe-fuzz-${{ github.run_id }}
          path: crates/observe-fuzz/artifacts/run.*/
          if-no-files-found: error
          retention-days: 14

      - name: Bounded Observe Miri campaign
        id: observe_miri
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nix develop .#miri -c bash crates/observe-tests/verify-miri.sh

      - name: Retain Observe Miri result
        if: always() && (steps.observe_miri.outcome == 'success' || steps.observe_miri.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observe-miri-${{ github.run_id }}
          path: target/miri-evidence/
          if-no-files-found: error
          retention-days: 14

  native_tls_research:
    name: Native TLS research (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/static-remote-transport
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Format and lint native fixture
        run: |
          nix develop -c cargo fmt --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml --all -- --check
          nix develop -c cargo clippy --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml --locked --bin transport_custody -- -D warnings
      - name: Build native fixture
        shell: bash
        run: |
          profile_args=()
          if [[ '${{ matrix.profile }}' == 'release' ]]; then
            profile_args+=(--release)
          fi
          nix develop -c cargo build --manifest-path docs/prds/static-remote-actors/transport-custody/Cargo.toml --locked --bin transport_custody --jobs 2 "${profile_args[@]}"
      - name: Observe both TLS layouts
        run: |
          nix develop -c python3 docs/prds/static-remote-actors/transport-custody/verify_transport_custody.py \
            "$CARGO_TARGET_DIR/${{ matrix.profile }}/transport_custody" \
            docs/prds/static-remote-actors/transport-custody/certificates \
            "target/transport-evidence/${{ matrix.profile }}"
      - name: Build and verify protected Counter Applications
        shell: bash
        run: |
          profile_args=()
          if [[ '${{ matrix.profile }}' == 'release' ]]; then
            profile_args+=(--release)
          fi
          evidence="target/transport-evidence/${{ matrix.profile }}"
          mkdir -p "$evidence"
          nix develop -c cargo test --locked --jobs 2 -p bombay-example-counter \
            --bin authorized --features protected-transport --no-run --message-format=json \
            "${profile_args[@]}" > "$evidence/protected-counter-build.jsonl" \
            2> "$evidence/protected-counter-build.stderr"
          executable=$(python3 - "$evidence/protected-counter-build.jsonl" '${{ matrix.profile }}' <<'PYTHON'
          import json, sys
          from pathlib import Path
          source = str(Path("examples/counter/src/bin/authorized.rs").resolve())
          executables = []
          expected_optimization = "3" if sys.argv[2] == "release" else "0"
          for line in Path(sys.argv[1]).read_text().splitlines():
              try:
                  artifact = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (artifact.get("reason") == "compiler-artifact"
                  and artifact["target"]["name"] == "authorized"
                  and artifact["target"]["src_path"] == source
                  and artifact["profile"]["test"]
                  and artifact["profile"]["opt_level"] == expected_optimization
                  and "protected-transport" in artifact["features"]):
                  executables.append(artifact["executable"])
          if len(executables) != 1 or executables[0] is None:
              raise SystemExit("exact protected Counter test executable was not built")
          print(executables[0])
          PYTHON
          )
          for campaign in "grant-stop target" "eof target" "release-query target" \
            "grant-stop sibling-processing" "grant-stop sibling-read"; do
            read -r grant_release evidence_source <<< "$campaign"
            nix develop -c python3 docs/prds/static-remote-actors/transport-custody/verify_protected_counter.py \
              "$executable" "$evidence/protected-counter-$grant_release-$evidence_source" \
              --source-root "$PWD" \
              --certificates docs/prds/static-remote-actors/transport-custody/certificates \
              --grant-release "$grant_release" --evidence-source "$evidence_source"
          done
          nix develop -c "$executable" child_stop_keeps_original_target_and_sibling \
            --nocapture > "$evidence/protected-child-stop.log" 2>&1
          python3 - "$evidence/protected-child-stop.log" <<'PYTHON'
          import re, sys
          from pathlib import Path
          output = Path(sys.argv[1]).read_text()
          expected = {"remote_counter::child_stop_keeps_original_target_and_sibling_for_" + provider + "_proof" for provider in ("recorded", "scheduled")}
          executed = re.findall(r"^test (\S+) \.\.\. ok$", output, re.MULTILINE)
          summaries = re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", output, re.MULTILINE)
          if len(executed) != 2 or set(executed) != expected or summaries != [("2", "0", "0")]:
              raise SystemExit("exact child Stop witnesses did not execute successfully")
          PYTHON
          nix develop -c "$executable" native_query_count_covers_provider_and_queue \
            --nocapture > "$evidence/protected-query-count.log" 2>&1
          python3 - "$evidence/protected-query-count.log" <<'PYTHON'
          import re, sys
          from pathlib import Path
          observed = Path(sys.argv[1]).read_text()
          expected = {"remote_counter::native_query_count_covers_provider_and_queue_for_" + provider + "_proof" for provider in ("recorded", "scheduled")}
          executed = re.findall(r"^test (\S+) \.\.\. ok$", observed, re.MULTILINE)
          summaries = re.findall(r"^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", observed, re.MULTILINE)
          if len(executed) != 2 or set(executed) != expected or summaries != [("2", "0", "0")]:
              raise SystemExit("exact native Query count witnesses did not execute successfully")
          PYTHON
      - name: Retain native transport observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-tls-${{ matrix.profile }}-${{ github.run_id }}
          path: target/transport-evidence/${{ matrix.profile }}/
          if-no-files-found: warn
          retention-days: 14
