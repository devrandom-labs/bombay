# Only mutations that cannot represent an observable bombay law belong here.
exclude_re = [
    # These functions exist only in the cfg(loom) test host. The ordinary
    # mutation sweep cannot compile them; the pinned Observe Loom derivation
    # owns that conditional implementation and its model checks.
    'crates/bombay/src/observe/mod\.rs:[0-9]+:[0-9]+: replace (lock|read_lock|write_lock) -> loom::sync::',
    'crates/bombay/src/observe/mod\.rs:[0-9]+:[0-9]+: replace recover -> T with Default::default\(\)',
]
