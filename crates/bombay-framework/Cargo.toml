[package]
name = "bombay-framework"
description = "Application-facing composition for the bombay local runtime."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bombay = { workspace = true }

[dev-dependencies]
behavior = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

[[example]]
name = "local_runtime"
path = "examples/local_runtime.rs"

[[example]]
name = "job_queue"
path = "examples/job_queue.rs"
