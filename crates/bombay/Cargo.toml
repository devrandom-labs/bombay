[package]
name = "bombay-rs"
description = "A pluggable process runtime over Bombay Behavior."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "bombay"

[lints]
workspace = true

[features]
default = []
axum = ["dep:axum", "tokio/net"]

[dependencies]
behavior = { workspace = true }
behavior-actors = { workspace = true }
bombay-engine = { workspace = true }
bombay-macros = { path = "../bombay-macros" }
bombay-address = { workspace = true }
bombay-machine = { workspace = true }
communication = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
timers = { workspace = true }
triomphe = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
trybuild = "1"
bombay-machine = { workspace = true }
dhat = "0.3"
loom = "0.7.2"
proptest = { workspace = true }

[target.'cfg(bombay_entity_loom)'.dependencies]
loom = "0.7.2"

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[[bench]]
name = "application_spine"
harness = false

[[bench]]
name = "mailbox_lanes"
harness = false

[[bench]]
name = "entity_directory"
harness = false

[[bench]]
name = "entity_lifecycle"
harness = false

[[bench]]
name = "machine_executor"
harness = false
