[package]
name = "bombay-rs"
description = "A pluggable process runtime over Bombay Behavior."
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../docs/user-facing-api.md"

[lib]
name = "bombay"

[lints]
workspace = true

[features]
default = []
remote = ["dep:serde", "dep:serde_json", "dep:zenoh", "dep:zenoh_config", "dep:zenoh_protocol", "dep:json-event-parser", "dep:futures-util"]
axum = ["dep:axum", "tokio/net"]

[dependencies]
behavior = { workspace = true }
behavior-actors = { workspace = true }
bombay-engine = { workspace = true }
bombay-macros = { version = "0.1.3", path = "../bombay-macros" }
bombay-address = { workspace = true }
communication = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
timers = { workspace = true }
triomphe = { workspace = true }
axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"], optional = true }
json-event-parser = { version = "=0.2.3", default-features = false, optional = true }
zenoh = { package = "bombay-zenoh", version = "=1.10.9", default-features = false, features = ["transport_tls"], optional = true }
zenoh_config = { package = "bombay-zenoh-config", version = "=1.10.2", default-features = false, optional = true }
zenoh_protocol = { package = "zenoh-protocol", version = "=1.10.1", default-features = false, optional = true }

[dev-dependencies]
behavior-macros = { package = "bombay-behavior-macros", version = "=0.14.2" }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
serde = { workspace = true }
serde_json = { workspace = true }
trybuild = "1"
dhat = "0.3"
loom = "0.7.2"
proptest = { workspace = true }

[target.'cfg(bombay_entity_loom)'.dependencies]
loom = "0.7.2"

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[[bench]]
name = "entity_directory"
harness = false

[[bench]]
name = "entity_lifecycle"
harness = false
