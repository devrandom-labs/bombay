[package]
name = "bombay-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
behavior = { package = "bombay-behavior", version = "0.16.0" }
bombay-engine = { path = ".." }

[[bin]]
name = "causal_turns"
path = "fuzz_targets/causal_turns.rs"
test = false
doc = false
bench = false

[patch.crates-io]
# Exact-revision exception (user-authorized): mirrors the root patch table so
# this independent lock selects the same PR #68 head revision. See the root
# Cargo.toml and the B5 pin-retirement task.
bombay-behavior = { git = "https://github.com/devrandom-labs/bombay-behavior.git", rev = "8bca837ca5d913bcdfaefbe0dec33d58bfc9ace6" }
bombay-behavior-actors = { git = "https://github.com/devrandom-labs/bombay-behavior.git", rev = "8bca837ca5d913bcdfaefbe0dec33d58bfc9ace6" }
bombay-behavior-macros = { git = "https://github.com/devrandom-labs/bombay-behavior.git", rev = "8bca837ca5d913bcdfaefbe0dec33d58bfc9ace6" }

[workspace]
