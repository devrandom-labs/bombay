query($login: String!, $number: Int!, $endCursor: String) {
  organization(login: $login) {
    projectV2(number: $number) {
      items(first: 100, after: $endCursor) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes {
          id
          status: fieldValueByName(name: "Status") { ...value }
          kind: fieldValueByName(name: "Kind") { ...value }
          phase: fieldValueByName(name: "Phase") { ...value }
          workstream: fieldValueByName(name: "Workstream") { ...value }
          risk: fieldValueByName(name: "Risk") { ...value }
          priority: fieldValueByName(name: "Priority") { ...value }
          stage: fieldValueByName(name: "Stage") { ...value }
          feature: fieldValueByName(name: "Feature") { ...value }
          effort: fieldValueByName(name: "Effort") { ...value }
          sequence: fieldValueByName(name: "Sequence") { ...value }
          startDate: fieldValueByName(name: "Start date") { ...value }
          targetDate: fieldValueByName(name: "Target date") { ...value }
          taskId: fieldValueByName(name: "Task ID") { ...value }
          linked: fieldValueByName(name: "Linked pull requests") {
            ... on ProjectV2ItemFieldPullRequestValue { pullRequests(first: 10) { nodes { url } } }
          }
          content {
            __typename
            ... on Issue {
              number title body url
              repository { nameWithOwner url }
              milestone { title description dueOn }
              labels(first: 20) { nodes { name } }
              assignees(first: 10) { nodes { login } }
            }
            ... on PullRequest {
              number title body url
              repository { nameWithOwner url }
              milestone { title description dueOn }
              labels(first: 20) { nodes { name } }
              assignees(first: 10) { nodes { login } }
            }
            ... on DraftIssue { title body }
          }
        }
      }
    }
  }
}
fragment value on ProjectV2ItemFieldValue {
  ... on ProjectV2ItemFieldSingleSelectValue { name }
  ... on ProjectV2ItemFieldTextValue { text }
  ... on ProjectV2ItemFieldNumberValue { number }
  ... on ProjectV2ItemFieldDateValue { date }
}
