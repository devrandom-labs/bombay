[package]
name = "bombay-zenoh-transport-custody"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bombay = { package = "bombay-rs", path = "../../../../crates/bombay" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time"] }
zenoh = { package = "bombay-zenoh", version = "=1.10.10", default-features = false, features = [
  "transport_tls",
] }

zenoh_config = { package = "bombay-zenoh-config", version = "=1.10.2", default-features = false }

futures-util = { version = "=0.3.34", default-features = false, features = [
  "std",
] }
json-event-parser = { version = "=0.2.3", default-features = false }

[dev-dependencies]
alloc_count = { version = "=0.4.0", default-features = false }
dhat = "=0.3.3"

[features]
protected-transport = ["zenoh/transport_tls", "bombay/remote"]

[[test]]
name = "protected_counter"
path = "../../../../crates/bombay/tests/protected_counter/mod.rs"

[workspace]
