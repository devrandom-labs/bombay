[package]
name = "bombay-zenoh-transport-custody"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time"] }
zenoh = { package = "bombay-zenoh", version = "=1.10.1", default-features = false, features = ["transport_tls"] }

