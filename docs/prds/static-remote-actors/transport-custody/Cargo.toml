[package]
name = "bombay-zenoh-transport-custody"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bombay = { package = "bombay-rs", version = "=0.1.1", path = "../../../../crates/bombay" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time"] }
zenoh = { package = "bombay-zenoh", version = "=1.10.3", default-features = false, features = ["transport_tls"] }

[workspace]

[patch.crates-io]
bombay-timers = { git = "https://github.com/devrandom-labs/bombay-timers.git", rev = "13e884da7ab41781f52337b0038060e375b00ee0" }
